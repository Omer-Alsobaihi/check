<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص المنتج - التحقق من الأصالة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .bg-shapes {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            will-change: transform;
        }

        .shape-1 { width: 300px; height: 300px; background: #667eea; top: -50px; right: -50px; animation: float 10s ease-in-out infinite; }
        .shape-2 { width: 200px; height: 200px; background: #764ba2; bottom: -30px; left: -30px; animation: float 12s ease-in-out infinite 2s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: slideUp 0.6s ease-out;
            will-change: transform;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            animation: pulse 3s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-wrapper svg {
            width: 45px; height: 45px;
            fill: white;
        }

        h1 {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            margin-bottom: 35px;
            font-weight: 400;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .code-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            direction: ltr;
            margin-bottom: 25px;
        }

        .code-inputs input {
            width: 56px;
            height: 64px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.2s ease;
            outline: none;
            -webkit-appearance: none;
        }

        .code-inputs input:focus {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .code-inputs input.filled {
            border-color: #48bb78;
            background: rgba(72, 187, 120, 0.15);
        }

        .code-inputs input.shake {
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .btn-verify {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-verify:active {
            transform: scale(0.97);
        }

        .btn-verify::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.4s;
        }

        .btn-verify:active::after {
            left: 100%;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 16px;
            display: none;
            animation: resultIn 0.4s ease;
        }

        .result-box.show { display: block; }

        @keyframes resultIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .result-success {
            background: rgba(72, 187, 120, 0.12);
            border: 1px solid rgba(72, 187, 120, 0.25);
            color: #68d391;
        }

        .result-error {
            background: rgba(245, 101, 101, 0.12);
            border: 1px solid rgba(245, 101, 101, 0.25);
            color: #fc8181;
        }

        /* ===== لون برتقالي لمستخدم سابقاً ===== */
        .result-used {
            background: rgba(237, 137, 54, 0.12);
            border: 1px solid rgba(237, 137, 54, 0.25);
            color: #f6ad55;
        }

        .result-box h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .result-box p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .result-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
        }

        .footer-text {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }

        .loader {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-verify.loading .btn-text { display: none; }
        .btn-verify.loading .loader { display: block; }

        .confetti {
            position: fixed;
            width: 8px; height: 8px;
            pointer-events: none;
            z-index: 100;
            will-change: transform;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 480px) {
            .card { padding: 35px 20px; }
            h1 { font-size: 1.5rem; }
            .code-inputs input { width: 48px; height: 56px; font-size: 1.4rem; }
            .shape { display: none; }
            .logo-wrapper { width: 80px; height: 80px; }
            .logo-wrapper svg { width: 40px; height: 40px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="container">
        <div class="card">
            <div class="logo-wrapper">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </div>

            <h1>فحص المنتج</h1>
            <p class="subtitle">أدخل رمز التحقق المكون من 5 أرقام للتأكد من أصالة المنتج</p>

            <form id="verifyForm" onsubmit="return false;">
                <div class="code-inputs" id="codeInputs">
                    <input type="text" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" inputmode="numeric" autocomplete="off">
                </div>

                <button type="submit" class="btn-verify" id="verifyBtn">
                    <span class="btn-text">التحقق من المنتج</span>
                    <div class="loader"></div>
                </button>
            </form>

            <div class="result-box" id="resultBox">
                <div class="result-icon" id="resultIcon"></div>
                <h3 id="resultTitle"></h3>
                <p id="resultMessage"></p>
            </div>

            <p class="footer-text">© 2026 نظام التحقق من المنتجات</p>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.code-inputs input');
        const btn = document.getElementById('verifyBtn');
        const resultBox = document.getElementById('resultBox');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');

        const fakeCodes = ['99999', '55555', '77777'];
        const usedCodes = ['12345', '00000', '11111'];

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val && /^[0-9]$/.test(val)) {
                    input.classList.add('filled');
                    if (index < inputs.length - 1) inputs[index + 1].focus();
                    else btn.focus();
                } else {
                    input.value = '';
                    input.classList.remove('filled');
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].classList.remove('filled');
                }
                if (e.key === 'ArrowLeft' && index > 0) inputs[index - 1].focus();
                if (e.key === 'ArrowRight' && index < inputs.length - 1) inputs[index + 1].focus();
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 5);
                paste.split('').forEach((char, i) => {
                    if (inputs[i]) {
                        inputs[i].value = char;
                        inputs[i].classList.add('filled');
                    }
                });
                if (paste.length === 5) btn.focus();
                else if (inputs[paste.length]) inputs[paste.length].focus();
            });

            input.addEventListener('focus', () => input.select());
        });

        function launchConfetti() {
            const colors = ['#667eea', '#764ba2', '#48bb78', '#ffd700'];
            const isMobile = window.innerWidth < 480;
            const count = isMobile ? 8 : 15;
            
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = (Math.random() * 100) + '%';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 6 + 4) + 'px';
                confetti.style.height = (Math.random() * 6 + 4) + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.animation = `confettiFall ${Math.random() * 2 + 2}s linear forwards`;
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        btn.addEventListener('click', () => {
            const code = Array.from(inputs).map(i => i.value).join('');

            if (code.length !== 5) {
                inputs.forEach(input => {
                    input.classList.add('shake');
                    setTimeout(() => input.classList.remove('shake'), 400);
                });
                showResult('warning', '⚠️', 'رمز ناقص', 'يرجى إدخال جميع الأرقام الخمسة للتحقق');
                inputs[0].focus();
                return;
            }

            btn.classList.add('loading');
            resultBox.classList.remove('show');

            setTimeout(() => {
                btn.classList.remove('loading');

                if (fakeCodes.includes(code)) {
                    showResult('error', '🚫', 'منتج غير أصلي', 'هذا الرمز غير مسجل في نظامنا. المنتج قد يكون مقلّداً. يرجى التواصل مع الدعم.');
                } else if (usedCodes.includes(code)) {
                    // ===== برتقالي لمستخدم سابقاً =====
                    showResult('used', '⏰', 'هذا الرمز مستخدم سابقاً', 'عذراً، تم استخدام هذا الرمز من قبل. يرجى التواصل مع الدعم.');
                } else {
                    showResult('success', '✅', 'المنتج أصلي', 'تهانينا! المنتج أصلي ومسجل في نظامنا. يمكنك استخدامه بثقة.');
                    launchConfetti();
                }
            }, 1200);
        });

        function showResult(type, icon, title, message) {
            let className = 'result-box show ';
            if (type === 'success') className += 'result-success';
            else if (type === 'used') className += 'result-used';   // برتقالي
            else className += 'result-error';
            
            resultBox.className = className;
            resultIcon.textContent = icon;
            resultTitle.textContent = title;
            resultMessage.textContent = message;
        }

        window.addEventListener('DOMContentLoaded', () => inputs[0].focus());
    </script>

</body>
</html>
